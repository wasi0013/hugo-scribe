baseURL = "https://example.org/"
title = "Scribe"
theme = "hugo-scribe"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 10

[params]
  author = "Your Name"
  description = "A minimal Hugo theme for people who write."
  mainSections = ["posts"]
  dateFormat = "Jan 02, 2006"
  showReadingTime = true

  # Image shown next to the site title. Path is relative to static/.
  logo = "favicon.png"
  favicon = "favicon.png"

  # Fallback image for social sharing previews.
  # socialImage = "images/social.png"

  # What first-time visitors see. Readers can change both from the gear menu.
  defaultTheme = "sepia"        # auto | light | sepia | dark
  defaultFont = "handwritten"   # handwritten | sans

[markup.highlight]
  # The theme ships its own syntax highlighting stylesheet.
  noClasses = false

[[menus.main]]
  name = "Blog"
  pageRef = "/"
  weight = 1

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 2

[[menus.footer]]
  name = "Tags"
  pageRef = "/tags"
  weight = 1
